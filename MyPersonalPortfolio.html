<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Personal Portfolio</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #ffffdd;
        color: #542d3d;
        font-family: Papyrus, fantasy;
    }

    .site-header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 32px;
        padding: 16px 7%;
        background: rgb(214 83 123 / 12%);
        border-bottom: 2px solid #d6537b / 12%;
    }

    .logo {
        display: block;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
    }

    nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    nav a {
        position: relative;
        display: inline-block;
        color: inherit;
        text-decoration: none;
        transition: color 180ms ease;
    }

    nav a::after {
        position: absolute;
        right: 0;
        bottom: -4px;
        left: 0;
        height: 2px;
        background: #d6537b;
        content: "";
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 180ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
        color: #d6537b;
    }

    nav a:hover::after,
    nav a:focus-visible::after {
        transform: scaleX(1);
    }

    .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(240px, 350px);
        align-items: center;
        gap: 48px;
        max-width: 1100px;
        min-height: 70vh;
        margin: 0 auto;
        padding: 48px 7%;
    }

    .hero h1 {
        margin: 0 0 16px;
        color: #d6537b;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.1;
    }

    .hero p {
        margin: 0 0 24px;
        font-size: 1.15rem;
    }

    .hero-image {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 12px;
        object-fit: cover;
        transform: translateY(-48px);
    }

    .showcase-button {
        display: inline-block;
        border: 0;
        border-radius: 4px;
        padding: 12px 18px;
        background: #d6537b;
        color: white;
        font: inherit;
        text-decoration: none;
        transition: background-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .showcase-button:hover,
    .showcase-button:focus-visible {
        background: #bd3f67;
        box-shadow: 0 5px 12px rgb(84 45 61 / 20%);
        transform: translateY(-3px);
    }

    .showcase-button:active {
        transform: translateY(0);
    }

    footer {
        padding: 20px 7%;
        border-top: 1px solid rgb(84 45 61 / 18%);
        text-align: center;
    }

    footer p {
        margin: 0;
    }

    @media (prefers-reduced-motion: reduce) {
        nav a,
        nav a::after,
        .showcase-button {
            transition: none;
        }
    }

    @media (max-width: 650px) {
        .site-header {
            align-items: flex-start;
            flex-direction: column;
        }

        nav ul {
            gap: 12px 20px;
        }

        .hero {
            grid-template-columns: 1fr;
            gap: 32px;
            min-height: 0;
        }

        .hero-image {
            max-width: 350px;
            transform: translateY(-16px);
        }
    }
</style>
</head>
