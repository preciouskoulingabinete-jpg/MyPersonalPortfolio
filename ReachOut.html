<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reach Out</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #ffffdd;
    color: #542d3d;
    font-family: Papyrus, fantasy;
  }

  .site-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 32px;
    padding: 16px 7%;
    background: rgb(214 83 123 / 12%);
    border-bottom: 2px solid rgb(214 83 123 / 12%);
  }

  .logo {
    display: block;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
  }

  nav ul {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  nav a,
  .social-links a {
    color: inherit;
    text-decoration: none;
  }

  nav a {
    position: relative;
    display: inline-block;
    transition: color 180ms ease;
  }

  nav a::after {
    position: absolute;
    right: 0;
    bottom: -4px;
    left: 0;
    height: 2px;
    background: #d6537b;
    content: "";
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 180ms ease;
  }

  nav a:hover,
  nav a:focus-visible,
  .social-links a:hover,
  .social-links a:focus-visible {
    color: #d6537b;
  }

  nav a:hover::after,
  nav a:focus-visible::after {
    transform: scaleX(1);
  }

  .contact-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 1fr);
    align-items: start;
    gap: 64px;
    max-width: 1100px;
    min-height: 70vh;
    margin: 0 auto;
    padding: 64px 7%;
  }

  .contact-layout h1 {
    margin: 0 0 24px;
    color: #d6537b;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.1;
  }

  .contact-form {
    display: grid;
    gap: 10px;
  }

  .contact-form label {
    margin-top: 8px;
  }

  .contact-form input,
  .contact-form textarea {
    width: 100%;
    border: 1px solid rgb(84 45 61 / 35%);
    border-radius: 4px;
    padding: 12px;
    background: white;
    color: inherit;
    font: inherit;
  }

  .contact-form textarea {
    min-height: 140px;
    resize: vertical;
  }

  .contact-form input:focus-visible,
  .contact-form textarea:focus-visible {
    outline: 2px solid #d6537b;
    outline-offset: 2px;
  }

  .send-button {
    justify-self: start;
    margin-top: 8px;
    border: 0;
    border-radius: 4px;
    padding: 12px 20px;
    background: #d6537b;
    color: white;
    font: inherit;
    cursor: pointer;
    transition: background-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
  }

  .send-button:hover,
  .send-button:focus-visible {
    background: #bd3f67;
    box-shadow: 0 5px 12px rgb(84 45 61 / 20%);
    transform: translateY(-3px);
  }

  footer {
    padding: 20px 7%;
    border-top: 1px solid rgb(84 45 61 / 18%);
    text-align: center;
  }

  footer p {
    margin: 0;
  }

  .social-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    nav a,
    nav a::after,
    .send-button {
      transition: none;
    }
  }

  @media (max-width: 650px) {
    .site-header {
      align-items: flex-start;
      flex-direction: column;
    }

    nav ul {
      gap: 12px 20px;
    }

    .contact-layout {
      grid-template-columns: 1fr;
      gap: 36px;
      min-height: 0;
      padding: 40px 7%;
    }
  }
</style>
</head>
<body>
  <header class="site-header">
    <img class="logo" src="C:\Users\Client\Downloads\logopic.png" alt="Precious's logo">
    <nav>
      <ul>
        <li><a href="C:\Users\Client\MyPersonalProject\MyPersonalPortfolio.html">Home</a></li>
        <li><a href="C:\Users\Client\MyPersonalProject\SomeFactsAboutMe.html">About</a></li>
        <li><a href="C:\Users\Client\MyPersonalProject\SkillsShowcase.html">Showcase</a></li>
        <li><a href="C:\Users\Client\MyPersonalProject\ReachOut.html">Contacts</a></li>
      </ul>
    </nav>
  </header>

  <main class="contact-layout">
    <section>
      <h1>Feel Free to Reach Out!</h1>
      <h2>My Socials!</h2>
      <div class="social-links">
        <a href="https://www.facebook.com/share/1E9rH8eB8K/">Facebook</a>
        <a href="https://www.instagram.com/kou_verse?mdxt=MWg1bTNkN2Q1azJjaQ==">Instagram</a>
        <a href="https://www.tiktok.com/@kou_niverse?_r=1&amp;_t=ZS-9AhzOQdL000">TikTok</a>
      </div>
    </section>

    <form class="contact-form" action="/submit-form" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email">

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <button class="send-button" type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Precious Koulin T. Gabinete. All rights reserved.</p>
  </footer>
</body>
</html>
